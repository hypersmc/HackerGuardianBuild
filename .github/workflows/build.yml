name: Build HackerGuardian

on:
  pull_request:
  push:
    branches:
      - master
      - "stabilize/**"
      - "refactor/**"
      - "ml/**"
      - "compat/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: hackerguardian_test
          MYSQL_USER: hgtest
          MYSQL_PASSWORD: hgtest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uhgtest -phgtest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hackerguardian_test
          POSTGRES_USER: hgtest
          POSTGRES_PASSWORD: hgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hgtest -d hackerguardian_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      HG_TEST_MYSQL_HOST: 127.0.0.1
      HG_TEST_MYSQL_PORT: 3306
      HG_TEST_MYSQL_DATABASE: hackerguardian_test
      HG_TEST_MYSQL_USERNAME: hgtest
      HG_TEST_MYSQL_PASSWORD: hgtest
      HG_TEST_POSTGRES_HOST: 127.0.0.1
      HG_TEST_POSTGRES_PORT: 5432
      HG_TEST_POSTGRES_DATABASE: hackerguardian_test
      HG_TEST_POSTGRES_USERNAME: hgtest
      HG_TEST_POSTGRES_PASSWORD: hgtest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B package

  compatibility-compile:
    name: compatibility-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: paper-1.21.11
            java: "21"
            api_group: io.papermc.paper
            api_artifact: paper-api
            api_version: 1.21.11-R0.1-SNAPSHOT
          - name: paper-26.2
            java: "25"
            api_group: io.papermc.paper
            api_artifact: paper-api
            api_version: 26.2.build.112-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile against ${{ matrix.name }}
        run: >-
          mvn -B -DskipTests package
          -Dserver.api.groupId=${{ matrix.api_group }}
          -Dserver.api.artifactId=${{ matrix.api_artifact }}
          -Dserver.api.version=${{ matrix.api_version }}

  ml-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ml/requirements.txt

      - name: Install ML tooling dependencies
        run: python -m pip install -r tools/ml/requirements.txt

      - name: Run supervised trainer self-test
        run: python tools/ml/train_behavior_model.py --self-test

      - name: Run population-normality trainer self-test
        run: python tools/ml/train_normality_model.py --self-test
