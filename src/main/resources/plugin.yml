name: HackerGuardian
main: me.hackerguardian.main.HackerGuardian
version: 2
description: HackerGuardian moderation, replay, and evidence-first detection platform.
author: HypersMC
libraries:
  - com.caucho:quercus:4.0.44
  - org.apache.commons:commons-lang3:3.12.0
  - org.apache.commons:commons-text:1.10.0
  - org.apache.commons:commons-configuration2:2.8.0
  - commons-validator:commons-validator:1.7
  - io.netty:netty-buffer:4.1.85.Final
  - com.zaxxer:HikariCP:7.0.2
api-version: 1.13
softdepend: [ViaVersion, ProtocolSupport]
depend: [ProtocolLib, Skulls]
database: true
load: POSTWORLD
folia-supported: false
commands:
  HackerGuardian:
  HG:
permissions:
  hg.admin.detection:
    description: Inspect HackerGuardian Detection v2 evidence.
    default: op
