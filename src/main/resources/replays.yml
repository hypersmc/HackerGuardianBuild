# HackerGuardian replay system
Replays:
  enabled: true

  # Seconds kept in RAM before a replay is triggered.
  prebuffer_seconds: 30

  # Seconds recorded after a trigger.
  postbuffer_seconds: 20

  # Subject movement/rotation evidence capture. 1 tick = 50 ms, so the default is
  # 20 Hz. The web actor engine interpolates these evidence samples at render rate.
  # Older pre-release `snapshot_interval_ticks` is superseded by this actor-specific
  # setting so nearby context/world capture can keep independent cadences.
  subject_snapshot_interval_ticks: 1

  # Milliseconds grouped into each compressed DB chunk.
  chunk_ms: 2000

  # Reserved for the future detection policy layer. Detection v2 does not
  # automatically trigger replays yet.
  ai_trigger_threshold: 0.92

  max_triggers_per_player_per_hour: 6

  codec: "gzip"
  format_version: 1

  context:
    debug: false
    enabled: true
    record_in_prebuffer: true
    radius: 32
    max_players: 6
    include_items: true

    # Nearby-player context can remain less frequent than the subject. 2 ticks is
    # 10 Hz and is independently interpolated by the browser actor runtime.
    interval_ticks: 2

  # World snapshots are shared by the in-game sandbox replay and the browser 3D
  # viewer. Every stored chunk is a complete immutable block-state keyframe. The
  # precise capture time is stored per chunk because capture is deliberately spread
  # over several server ticks.
  world_capture:
    enabled: true
    chunk_radius: 2
    max_chunks: 200
    chunks_per_tick: 2
    max_inflight: 4

    # Optional identifier for the resource-pack stack used by this server. The web
    # viewer uses it to select a locally imported texture/model pack. Leave empty to
    # fall back to the recorded Minecraft version (for example "1.21.11").
    resource_pack_id: ""

  sandbox:
    enabled: true
    mode: CHUNKS
    chunk_radius: 2
    max_chunks: 200
    include_prebuffer: true
    world_prefix: "hg_replay_"
    delete_world_on_exit: true
