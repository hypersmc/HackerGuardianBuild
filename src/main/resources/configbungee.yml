# HackerGuardian Bungee / FlameCord configuration
#
# Supported database types: MYSQL, POSTGRESQL
Database:
  type: MYSQL
  host: "127.0.0.1"
  port: 3306
  name: "hackerguardian"
  username: "changeme"
  password: "changeme"
  ssl: false

  pool:
    maximum_size: 10
    minimum_idle: 2
    connection_timeout_ms: 10000
    validation_timeout_ms: 5000
    idle_timeout_ms: 60000
    max_lifetime_ms: 600000

debug: false

Settings:
  shared_secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  ticket_ttl_ms: 15000
  verify_window_ms: 2000
  hg_secure_link: false
  behind_proxy: true
  UseWebsiteFunction: false

SettingsWeb:
  Api:
    enabled: true
    bind_host: "0.0.0.0"
    bind_port: 8787
    require_auth: true
    allowed_skew_ms: 90000
    nonce_ttl_ms: 300000

    keys:
      panel-1: "CHANGE_ME_TO_LONG_RANDOM_SECRET"

Punishments:
  # Usable placeholders: %expires% %reason% %id%
  messages:
    kick: "&cYou were kicked.\n&7Reason: &f%reason%"
    ban_kick: "&cYou are banned.\n&7Reason: &f%reason%"
    ban_join: "&cYou are banned.\n&7Reason: &f%reason%\n&7Expires: &f%expires%"
    ipban_join: "&cThe IP you are joining from is banned.\n&7Reason: &f%reason%"
    ipban_kick: "&cYou are IP-banned.\n&7Reason: &f%reason%"

    ban_join_temp: |
      &cYou are temporarily banned for &f%expires% &cfrom this server!

      &7Reason: &f%reason%
      &7Find out more: &bhttps://your.site/appeal

      &7Ban ID: &f#%id%
      &7Sharing your Ban ID may affect the processing of your appeal!

    ban_join_perm: |
      &cYou are permanently banned from this server!

      &7Reason: &f%reason%
      &7Find out more: &bhttps://your.site/appeal

      &7Ban ID: &f#%id%
      &7Sharing your Ban ID may affect the processing of your appeal!

    muted_chat: |
      &cYou are muted.

      &7Reason: &f%reason%
      &7Expires in: &f%expires%

    ipban_join_temp: |
      &cYou are temporarily IP-banned for &f%expires% &cfrom this server!

      &7Reason: &f%reason%
      &7Find out more: &bhttps://your.site/appeal

      &7IP Ban ID: &f#%id%
      &7Sharing your Ban ID may affect the processing of your appeal!

    ipban_join_perm: |
      &cYou are permanently IP-banned from this server!

      &7Reason: &f%reason%
      &7Find out more: &bhttps://your.site/appeal

      &7IP Ban ID: &f#%id%
      &7Sharing your Ban ID may affect the processing of your appeal!
