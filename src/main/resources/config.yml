# HackerGuardian core configuration
#
# Feature-specific settings live in separate files to keep configuration small:
#   database.yml     - SQL provider, connection and pool
#   detection.yml    - Detection / ML evidence pipeline
#   replays.yml      - replay recording and playback
#   moderation.yml   - reports and punishments
#   api.yml          - server-side web API
#   secure-link.yml  - proxy authorization/ticket settings

# Enables extra logs and stack traces. Only enable while troubleshooting.
debug: false

Settings:
  # Unique backend identifier used for server-scoped moderation/replays.
  server_name: "pvp"

  # Set true when players normally join through Bungee/FlameCord/Velocity.
  behind_proxy: false

  # The current website is being replaced. This switch remains only for the
  # existing API lifecycle until the new API configuration owns it completely.
  UseWebsiteFunction: false
