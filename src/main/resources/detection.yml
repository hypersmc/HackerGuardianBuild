# HackerGuardian Detection v2
#
# Detection produces evidence only. It never punishes a player directly.
DetectionV2:
  enabled: true

  # Rolling observation window used to build one BehaviorSnapshot.
  window_ms: 5000

  # 20 ticks = about one assessment per second.
  assessment_interval_ticks: 20

  # Recent assessments retained in RAM per online player.
  history_size: 20

  detectors:
    reach:
      enabled: true
      soft_distance: 4.5
      hard_distance: 6.0

    click_burst:
      enabled: true
      soft_cps: 22.0
      hard_cps: 35.0
      minimum_swings: 20

  # Sanitized finding history for the server-side Laravel API. This is not a
  # training label source and contains no API/database/config secrets.
  web_journal:
    enabled: true
    retention_days: 30
    queue_capacity: 4096

    # The periodic detector loop can see the same condition across many adjacent
    # windows. Suppress near-identical repeats instead of storing one row/second.
    repeat_suppression_ms: 5000
    score_delta: 0.10

  # Deterministic checks do not need ML or Learning Mode. They observe Bukkit
  # events and feed recent physics/geometry evidence into the same assessment.
  # They are evidence-only for now; a separate policy layer decides actions.
  deterministic:
    enabled: true

    # Event findings are retained only long enough to join the rolling
    # DetectionAssessment and are collapsed by check id before aggregation.
    evidence_retention_ms: 5000
    max_events_per_player: 128

    mining:
      fast_break:
        enabled: true

        # Ignore blocks whose conservative vanilla minimum is below this. Very
        # fast blocks are noisy and do not provide useful fast-break evidence.
        minimum_expected_ms: 150

        # A finding requires the observed duration to be far below Bukkit's
        # Block#getBreakSpeed envelope. 0.55 is intentionally conservative.
        minimum_ratio: 0.55
        tolerance_ms: 75

      multi_break:
        enabled: true

        # Detect several blocks that each require meaningful mining time but
        # nevertheless all complete inside the same tiny server-side window.
        window_ms: 250
        minimum_blocks: 3
        minimum_per_block_ms: 150

    block_interaction:
      reach:
        enabled: true

        # Distance is eye -> closest point on the target block bounding box,
        # not center-to-center. This is deliberately above normal vanilla reach
        # so lag/edge geometry does not become an automatic accusation.
        max_distance: 5.75
        hard_excess_distance: 1.50

      line_of_sight:
        enabled: true

        # Seven rays are sampled across the target bounding box. A through-wall
        # finding is emitted only when every ray hits another collidable block.
        minimum_distance: 1.50

  # Supervised LEGIT/CHEAT baseline retained from ML v1. This is one evidence
  # source, not HackerGuardian's definition of normal behavior.
  ml:
    enabled: false
    model_file: "models/behavior-v1.hgml"
    finding_floor: 0.55
    base_reliability: 0.85
    minimum_activity_samples: 20
    max_ping_ms: 500
    minimum_tps: 18.0

    dataset:
      # Manual, deliberate LEGIT/CHEAT capture only. Detections never label it.
      enabled: true
      file: "ml/dataset-v1.csv"
      queue_capacity: 2048
      default_capture_minutes: 10

  # Population anomaly model trained primarily from trusted-player Learning
  # Mode data. Enable only after population-normality-v1.hgif has been trained.
  normality:
    enabled: false
    model_file: "models/population-normality-v1.hgif"
    finding_floor: 0.60
    base_reliability: 0.60
    minimum_activity_samples: 20
    max_ping_ms: 500
    minimum_tps: 18.0

    # Reliability is deliberately reduced until the model represents a broad
    # enough player population.
    target_training_players: 25

  # Learning Mode v2 automatically observes a deliberately trusted population.
  # Candidate rows are quarantined; they are not instantly treated as "legit".
  learning:
    enabled: false

    # Players whose behavior is collected are told that Learning Mode is active.
    notify_players: true

    # Recommended: assign this permission only to known/high-confidence players
    # using LuckPerms or your normal permission system. Be careful with broad '*'
    # admin grants if those accounts are also used for cheat/adversarial testing.
    trusted_permission: "hg.learning.trusted"

    # Optional explicit UUID allowlist in addition to the permission above.
    trusted_uuids: []

    # A captured row cannot enter a normality training run until this time has
    # elapsed AND the player is still trusted in the current trust manifest.
    quarantine_days: 14.0

    # Minimum accumulated trusted active-observation time before a player is
    # considered a mature baseline contributor by the generated trust manifest.
    minimum_baseline_hours: 10.0

    # Do not count idle/AFK connection time as collected behavioral hours and do
    # not write candidate rows when there is no tracked activity in the window.
    minimum_activity_samples: 1

    # Record one candidate BehaviorSnapshot per trusted player at this interval.
    # Fifteen seconds still yields thousands of windows per player/day while
    # avoiding unnecessary near-duplicate rows and runaway long-term disk use.
    sample_interval_seconds: 15.0
    state_save_interval_ticks: 1200

    state_file: "ml/normality/learning-state.properties"
    manifest_file: "ml/normality/trust-manifest-v1.csv"

    dataset:
      file: "ml/normality/candidate-behavior-v1.csv"
      queue_capacity: 8192

    # Client-side fake-player probes are supplemental reaction measurements.
    # They never constitute a cheat verdict and never become punishments.
    probes:
      enabled: true
      result_file: "ml/normality/probe-results-v1.csv"
      queue_capacity: 1024

      # Automatic probes begin only after this much trusted active play time.
      minimum_collected_hours: 10.0

      # At most roughly one automatic probe per this interval, plus random
      # jitter so probes are not predictable from a fixed schedule.
      cooldown_hours: 24.0
      cooldown_jitter_hours: 12.0

      # 40 ticks is roughly two seconds.
      duration_ticks: 40
      avoid_combat: true

      min_distance: 3.0
      max_distance: 5.0
      min_yaw_offset_degrees: 55.0
      max_yaw_offset_degrees: 125.0
      fov_threshold_degrees: 12.0
      rotation_epsilon_degrees: 1.5
